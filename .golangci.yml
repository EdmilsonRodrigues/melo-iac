version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
    - unit

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gosec:
      severity: high
      confidence: high
      excludes:
        - G104 # Errors unhandled (já coberto pelo errcheck).
        - G307 # Poor file permissions used when creating a file with os.Create.
        - G304 # File path provided as taint input (file inclusion).
        - G101 # Potential hardcoded credentials.
    revive:
      severity: warning
      rules:
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
